name: Daten aktualisieren und Seite veröffentlichen

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:          # manuell starten über "Run workflow"
  push:
    branches: [main]          # nach jeder Änderung neu veröffentlichen

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Daten von Blizzard abrufen
        id: fetch
        continue-on-error: true
        run: node scripts/update-data.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}

      - name: Neue Daten speichern
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898314+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          git diff --staged --quiet || (git commit -m "Daten aktualisiert" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
